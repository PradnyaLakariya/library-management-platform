apiVersion: apps/v1
kind: Deployment
metadata:
  name: library-python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: library-python-app
  template:
    metadata:
      labels:
        app: library-python-app
    spec:
      containers:
        - name: library-python-app
          image: library-management-python:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: library-python-service
spec:
  type: NodePort
  selector:
    app: library-python-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
